<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graft Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f4f4f5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #1f1f1f;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f4f4f5;
    }

    .header-text p {
      font-size: 11px;
      color: #71717a;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #111111;
      border-bottom: 1px solid #1f1f1f;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3f3f46;
      flex-shrink: 0;
    }

    .status-dot.connected  { background: #22c55e; }
    .status-dot.syncing    { background: #f59e0b; animation: pulse 1s infinite; }
    .status-dot.error      { background: #ef4444; }
    .status-dot.unconfigured { background: #3f3f46; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text {
      font-size: 12px;
      color: #a1a1aa;
    }

    .script-badge {
      margin-left: auto;
      background: #1f1f1f;
      color: #71717a;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .script-badge.active { background: #1c2e1c; color: #4ade80; }

    .section {
      padding: 14px 16px;
      border-bottom: 1px solid #1f1f1f;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #52525b;
      margin-bottom: 8px;
    }

    .key-input-wrapper {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #f4f4f5;
      font-size: 11px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #f97316; }

    .btn {
      background: #f97316;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: #ea580c; }

    .btn-ghost {
      background: transparent;
      color: #71717a;
      border: 1px solid #2a2a2a;
    }

    .btn-ghost:hover { background: #1a1a1a; color: #f4f4f5; }

    .key-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 7px 10px;
    }

    .key-display code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: #a1a1aa;
      flex: 1;
    }

    .synced-at {
      font-size: 10px;
      color: #52525b;
      margin-top: 6px;
    }

    .footer {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer a {
      font-size: 11px;
      color: #f97316;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">G</div>
    <div class="header-text">
      <h1>Graft Companion</h1>
      <p>Browser automation sync</p>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking connection...</span>
    <span class="script-badge" id="scriptBadge">0 scripts</span>
  </div>

  <div class="section" id="setupSection">
    <div class="section-label">Team API Key</div>
    <div class="key-input-wrapper">
      <input type="password" id="apiKeyInput" placeholder="graft_xxxxxxxxxxxx..." autocomplete="off" spellcheck="false" />
      <button class="btn" id="saveKeyBtn">Connect</button>
    </div>
  </div>

  <div class="section hidden" id="connectedSection">
    <div class="section-label">Connected Key</div>
    <div class="key-display">
      <code id="keyDisplay">graft_••••••••</code>
      <button class="btn btn-ghost" id="changeKeyBtn" style="padding:4px 8px;font-size:11px;">Change</button>
    </div>
    <div class="synced-at" id="syncedAt">Never synced</div>
  </div>

  <div class="footer">
    <a href="https://graft.app" target="_blank">Open Graft Dashboard ↗</a>
    <button class="btn btn-ghost" id="syncNowBtn" style="padding:4px 10px;font-size:11px;">Sync Now</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
